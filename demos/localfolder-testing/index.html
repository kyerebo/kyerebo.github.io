<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A420C">
  <link rel="manifest" href="manifest.json">
  <title>LocalFolder Testing</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 1000px; margin: 24px auto; padding: 0 20px; }
    h1 { color: #43852b; }
    input { width: min(100%, 650px); padding: 8px; }
    button { padding: 10px; margin: 8px 8px 8px 0; cursor: pointer; }
    pre { padding: 16px; background: light-dark(#f5f5f0, #222); white-space: pre-wrap; overflow-wrap: anywhere; }
    iframe { width: 100%; height: 160px; }
  </style>
</head>
<body>
  <a href="../../index.html">Back to demos</a>
  <h1>LocalFolder Testing</h1>
  <p>Temporary validation of a Store-packaged PWA's LocalFolder access through OPFS.
    No feature flag is required. Use only a disposable package and seeded test file.</p>
  <label for="pfn">Package family name (PFN)</label><br>
  <input id="pfn" autocomplete="off" placeholder="Installed package family name"><br>
  <button id="positive">Run T1-T6 (deletes lf_test.txt)</button>
  <button id="isolation">Inspect isolation (no writes)</button>
  <p id="context"></p>
  <pre id="result">No tests run.</pre>
  <h2>Same-origin iframe (not sandboxed)</h2>
  <iframe id="same-origin" src="frame.html" title="Same-origin OPFS inspection"></iframe>
  <h2>Cross-origin iframe (best-effort framing)</h2>
  <iframe id="cross-origin" src="https://example.com/" title="Cross-origin frame for DevTools inspection"></iframe>
  <script type="module">
    import { runPositive, inspectIsolation } from './tests.js';
    const result = document.getElementById('result');
    const pfn = document.getElementById('pfn');
    document.getElementById('context').textContent =
      `Origin: ${location.origin}; top frame: ${window === top}; standalone: ${matchMedia('(display-mode: standalone)').matches}`;
    window.runLocalFolderTests = runPositive;
    window.inspectLocalFolderIsolation = inspectIsolation;
    async function run(operation) {
      try {
        const output = await operation(pfn.value.trim());
        result.textContent = JSON.stringify(output, null, 2);
        console.log(result.textContent);
      } catch (error) {
        result.textContent = JSON.stringify({ status: 'ERROR', name: error.name, message: error.message }, null, 2);
        console.error(error);
      }
    }
    document.getElementById('positive').onclick = () => run(runPositive);
    document.getElementById('isolation').onclick = () => run(inspectIsolation);
  </script>
</body>
</html>
